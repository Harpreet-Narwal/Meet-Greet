name: ci-api

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-api.yml"

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://mulaqat:mulaqat@localhost:5432/mulaqat
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mulaqat
          POSTGRES_PASSWORD: mulaqat
          POSTGRES_DB: mulaqat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mulaqat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate + validate
        run: |
          pnpm --filter @mulaqat/api db:generate
          pnpm --filter @mulaqat/api db:validate
      # `migrate diff --from-migrations` REPLAYS every migration into whatever
      # database it is handed as the shadow. Handing it $DATABASE_URL therefore
      # leaves the main database with a populated schema but no migration
      # history, and the later `migrate deploy` aborts with P3005. Give it a
      # throwaway database of its own instead.
      - name: Create shadow database for the drift check
        run: PGPASSWORD=mulaqat psql -h localhost -U mulaqat -d mulaqat -c 'CREATE DATABASE mulaqat_shadow;'
      - name: Migration drift check (schema ⇄ migrations)
        working-directory: services/api
        run: |
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://mulaqat:mulaqat@localhost:5432/mulaqat_shadow" \
            --exit-code
      - name: Lint
        run: pnpm --filter @mulaqat/api lint
      - name: Typecheck
        run: pnpm --filter @mulaqat/api typecheck
      - name: Unit tests
        run: pnpm --filter @mulaqat/api test
      - name: Migrate + seed
        run: |
          pnpm --filter @mulaqat/api db:deploy
          pnpm --filter @mulaqat/api db:seed
      # matching.e2e-spec deliberately points AI_URL at the REAL service so the
      # matching engine runs for real rather than against a stub. Without it the
      # /match call 503s and four specs fail. Matching is pure deterministic math
      # over Postgres — no LLM, no vector store — so DATABASE_URL is all it needs,
      # and --network host lets it reach the postgres service container and
      # publish :8000 back to the runner.
      - name: Build + start the ai service (for the matching e2e)
        run: |
          docker build -t mulaqat-ai:ci services/ai
          docker run -d --name mulaqat-ai --network host -e DATABASE_URL="$DATABASE_URL" mulaqat-ai:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/health || { docker logs mulaqat-ai; exit 1; }
      - name: E2E tests (real Postgres + Redis + ai)
        run: pnpm --filter @mulaqat/api test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
