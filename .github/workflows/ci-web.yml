name: ci-web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @mulaqat/web lint
      - name: Typecheck
        run: pnpm --filter @mulaqat/web typecheck
      - name: Unit tests (Vitest)
        run: pnpm --filter @mulaqat/web test
      - name: Build
        run: pnpm --filter @mulaqat/web build
      - name: Smoke — landing page serves and carries the brand
        run: |
          pnpm --filter @mulaqat/web start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health && break; sleep 1; done
          curl -sf http://localhost:3000/health | grep '"ok"'
          curl -sf http://localhost:3000/ | grep -i "mulaqat"

  # M1 acceptance flow: login → quiz → archetype → profile against the compose stack.
  # (Becomes the booking happy path in M2 per plan §9.2.)
  e2e-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Boot the stack
        # docker-compose.ci.yml builds web from the production `runner` target
        # instead of `dev`, so `next dev` is not watching the workspace while the
        # specs run — see that file for why the HMR rebuilds broke login.
        #
        # API_NODE_ENV=test turns on RateLimitGuard's documented test bypass for
        # the api container only. Every Playwright spec signs a fresh user in,
        # and with CI retries that clears the 10/min OTP cap from the runner's
        # single IP — the tokens come back undefined and the specs fail on the
        # symptom rather than the cause.
        env:
          API_NODE_ENV: test
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build postgres redis api ai web
      - name: Wait for health + seed
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health && break; sleep 3; done
          for i in $(seq 1 60); do curl -sf http://localhost:3000/health && break; sleep 3; done
          docker compose exec -T api sh -c "pnpm --filter @mulaqat/api db:deploy && pnpm --filter @mulaqat/api db:seed"
      # The checked-in client is what `apps/web` type-checks against, so when it
      # drifts, web compiles against an API that no longer exists. It had gone
      # 1091 lines stale before anyone noticed, because regenerating it was a
      # documented habit with nothing enforcing it. The api is already up here.
      - name: API client is in sync with the live OpenAPI document
        run: |
          pnpm gen:client
          git diff --exit-code -- packages/types/src/api.gen.d.ts \
            || { echo "::error::packages/types is stale — run 'pnpm gen:client' and commit the result."; exit 1; }
      - name: Install Playwright chromium
        run: pnpm --filter @mulaqat/web exec playwright install --with-deps chromium
      - name: Onboarding + booking flows (Playwright)
        run: pnpm --filter @mulaqat/web test:e2e
      # Lighthouse gates run against a production build (dev server would sandbag perf)
      - name: Build web for Lighthouse
        run: pnpm --filter @mulaqat/web build
      - name: Lighthouse — SEO ≥ 0.95, performance ≥ 0.90 on public pages
        run: |
          (cd apps/web && pnpm exec next start --port 3100 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3100/health && break; sleep 1; done
          npx --yes @lhci/cli@0.14.0 autorun --config=apps/web/.lighthouserc.json
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
